[project]
name = "filmheuristic"
version = "0.1.0"
description = "Classify films as Hollywood (H) or Alternative (A) from a Letterboxd export"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.scripts]
filmheuristic = "filmheuristic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filmheuristic"]
